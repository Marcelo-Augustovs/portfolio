<div class="project-card">

  <div class="video-container">

    <!-- Thumbnail -->
    <div class="thumbnail" *ngIf="!videoLoaded" (click)="loadVideo()">
      <img [src]="thumbnailUrl" />
      <div class="play-overlay"></div>
    </div>

    <!-- Iframe -->
    <iframe
      *ngIf="videoLoaded"
      [src]="safePreviewUrl"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

  </div>

  <div class="project-content">
    <h3>{{ projectName }}</h3>
    <p class="tech">{{ techUsed }}</p>
    <p class="description">{{ projectDescription }}</p>

    <div class="buttons">
      <a class="btn preview" [href]="previewLink" target="_blank">Preview</a>
      <a class="btn github" [href]="githubLink" target="_blank">Github</a>
    </div>
  </div>

  <button class="nav-btn right" (click)="proximoProjeto()">❯</button>
  <button class="nav-btn left" (click)="projetoAnterior()">❮</button>

</div>
