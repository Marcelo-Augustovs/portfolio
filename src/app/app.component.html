<mat-sidenav-container class="app-container">

  <mat-sidenav #sidenav mode="over" class="app-sidenav">
    <div class="sidenav-header">
      <img src="assets/_imagens/dev-marcelo-icone.webp" alt="Marcelo Augusto">
      <h2>Marcelo Augusto</h2>
      <p>Desenvolvedor e Analista de Sistemas</p>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        (click)="closeSidenav()">
        <mat-icon matListItemIcon>home</mat-icon>
        <div matListItemTitle>Home</div>
      </a>
      <a mat-list-item routerLink="/experiencia" routerLinkActive="active" (click)="closeSidenav()">
        <mat-icon matListItemIcon>work</mat-icon>
        <div matListItemTitle>Experiência</div>
      </a>
      <a mat-list-item routerLink="/contato" routerLinkActive="active" (click)="closeSidenav()">
        <mat-icon matListItemIcon>contact_mail</mat-icon>
        <div matListItemTitle>Contato</div>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content-wrapper">
    <!-- TOOLBAR (MOBILE ONLY) -->
    <mat-toolbar color="primary" class="app-toolbar mobile-only">
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Marcelo Augusto</span>
    </mat-toolbar>

    <!-- CABEÇALHO ORIGINAL (DESKTOP ONLY) -->
    <header id="cabecalho" class="desktop-only">
      <nav id="menu">
        <ul>
          <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
          <li><a routerLink="/experiencia" routerLinkActive="active">Experiência</a></li>
          <li><a routerLink="/contato" routerLinkActive="active">Contato</a></li>
        </ul>
      </nav>
      <div class="header-top">
        <hgroup>
          <h1>Marcelo Augusto</h1>
          <h2>Desenvolvedor e Analista de Sistemas</h2>
        </hgroup>
        <div id="perfil-image">
          <img src="assets/_imagens/dev-marcelo-icone.webp">
        </div>
      </div>
    </header>

    <!-- CONTAINER PRINCIPAL DO SITE -->
    <div id="interface">
      <router-outlet></router-outlet>
      <footer id="rodape"></footer>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
